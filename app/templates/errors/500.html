{% extends "base.html" %}

{% block content %}
<div class="container my-5 text-center">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 bg-white shadow-sm rounded-4 p-5">
        <div class="display-1 fw-bold text-danger mb-3">500</div>
        <h2 class="h4 fw-bold text-dark mb-2">Unexpected Server Error</h2>
        <p class="text-muted mb-4">Something went wrong on our end. Our team has been notified.</p>
        <div>
          <a href="{{ url_for('blog.index') }}" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-arrow-left me-1"></i> Return Home
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
